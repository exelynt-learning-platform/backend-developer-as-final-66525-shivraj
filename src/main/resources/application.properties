# =========================================
# Server Configuration
# =========================================
server.port=8081


# =========================================
# MySQL Database Configuration
# =========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================
# JPA / Hibernate Configuration
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Show SQL queries in console
spring.jpa.show-sql=false

# Disable Open EntityManager in View
spring.jpa.open-in-view=false


# =========================================
# JWT Configuration
# =========================================
jwt.secret=${JWT_SECRET:change-this-to-a-strong-secret-key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


# =========================================
# Swagger / OpenAPI Configuration
# =========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html